name = "yusando-gallery"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "docs"
binding = "ASSETS"

[vars]
PRICE_TIERS = "3000,5000,7000,10000"
CLAUDE_MODEL = "claude-sonnet-5"

[[d1_databases]]
binding = "DB"
database_name = "gallery-db"
database_id = "6aee87a8-e748-4515-859b-5285a03bc4a1"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gallery-photos"

# Secrets（ダッシュボード Settings → Variables and Secrets で追加）
#   ANTHROPIC_API_KEY  … Claude API キー
#   UPLOAD_TOKEN       … 登録画面の合言葉
