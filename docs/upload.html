<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>茶器を登録する — 悠三堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f3ea;--paper-deep:#efe8d8;--ink:#2b2a26;--ink-soft:#5a564c;
  --matcha:#4a5d3a;--matcha-deep:#37452b;--rikyu:#8a8c78;--shu:#a53f2b;
  --gold:#b0965a;--line:#d8cfba;
  --serif:"Shippori Mincho",serif;--sans:"Zen Kaku Gothic New",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);
  line-height:1.9;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 80px}

header{border-bottom:1px solid var(--line);background:rgba(247,243,234,.94);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
.hd{max-width:640px;margin:0 auto;padding:0 20px;height:58px;
  display:flex;align-items:center;justify-content:space-between}
.hd b{font-size:15px;letter-spacing:.12em;font-weight:600}
.hd a{font-family:var(--sans);font-size:11.5px;letter-spacing:.12em;color:var(--ink-soft)}

h1{font-size:24px;letter-spacing:.14em;font-weight:500;margin-top:38px}
.lede{font-family:var(--sans);font-size:13px;line-height:1.95;color:var(--ink-soft);margin-top:12px}

.field{margin-top:34px}
.label{font-family:var(--sans);font-size:12px;letter-spacing:.16em;color:var(--matcha);
  display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.label .count{margin-left:auto;font-size:11px;color:var(--rikyu);letter-spacing:.08em}

/* --- 撮影ガイド --- */
.guide{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
@media (max-width:520px){.guide{grid-template-columns:repeat(2,1fr)}}
.g{border:1px solid var(--line);border-radius:4px;background:var(--paper-deep);
  padding:10px 8px 9px;text-align:center}
.g svg{width:34px;height:34px;margin:0 auto 6px;fill:none;stroke:var(--matcha);
  stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.g b{display:block;font-size:12.5px;letter-spacing:.08em;font-weight:500}
.g span{display:block;font-family:var(--sans);font-size:10px;line-height:1.6;color:var(--rikyu);margin-top:2px}

/* --- ドロップ / 選択エリア --- */
.drop{border:1px dashed var(--gold);border-radius:6px;background:var(--paper-deep);
  padding:26px 18px;text-align:center;transition:.25s;cursor:pointer}
.drop.over{background:#e9e0cb;border-color:var(--matcha)}
.drop p{font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
.drop small{display:block;font-family:var(--sans);font-size:11px;color:var(--rikyu);margin-top:7px}
.drop .btn{margin-top:14px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* --- サムネイル --- */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:14px}
.th{border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff;position:relative}
.th img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--paper-deep)}
.th .no{position:absolute;top:7px;left:7px;font-family:var(--sans);font-size:10px;
  letter-spacing:.08em;background:rgba(247,243,234,.94);border:1px solid var(--line);
  border-radius:999px;padding:2px 9px;color:var(--ink-soft)}
.th.first .no{background:var(--matcha);color:var(--paper);border-color:var(--matcha)}
.th .rm{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--line);background:rgba(247,243,234,.94);color:var(--shu);
  font-size:15px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.th .rm:hover{background:var(--shu);color:var(--paper);border-color:var(--shu)}
.th .bar{display:flex;border-top:1px solid var(--line)}
.th .bar button{flex:1;border:0;background:none;padding:9px 0;cursor:pointer;
  font-size:14px;color:var(--matcha);font-family:var(--sans)}
.th .bar button+button{border-left:1px solid var(--line)}
.th .bar button:disabled{color:#c9c3b2;cursor:default}
.th .name{position:absolute;bottom:38px;left:0;right:0;padding:4px 8px;
  font-family:var(--sans);font-size:9.5px;color:var(--paper);
  background:linear-gradient(transparent,rgba(43,42,38,.72));
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hint{font-family:var(--sans);font-size:11.5px;color:var(--rikyu);margin-top:10px;line-height:1.8}

select,input[type=password]{width:100%;font-family:var(--sans);font-size:15px;
  padding:13px 14px;border:1px solid var(--line);border-radius:4px;
  background:var(--paper);color:var(--ink)}
select:focus,input:focus{outline:0;border-color:var(--matcha)}

.btn{display:inline-block;font-family:var(--sans);font-size:13px;letter-spacing:.18em;
  padding:13px 32px;border:1px solid var(--matcha);color:var(--matcha);
  background:transparent;cursor:pointer;transition:.3s;border-radius:2px}
.btn:hover{background:var(--matcha);color:var(--paper)}
.btn.solid{background:var(--matcha);color:var(--paper);width:100%;padding:17px;font-size:14px}
.btn.solid:hover{background:var(--matcha-deep)}
.btn:disabled{opacity:.45;cursor:default}
.btn.solid:disabled:hover{background:var(--matcha)}

.msg{margin-top:18px;font-family:var(--sans);font-size:13px;line-height:1.9;
  padding:14px 16px;border-radius:4px;border:1px solid var(--line);background:var(--paper-deep)}
.msg.err{border-color:rgba(165,63,43,.4);color:var(--shu)}
.msg.ok{border-color:rgba(74,93,58,.4)}
.msg a{color:var(--matcha);border-bottom:1px solid rgba(74,93,58,.35)}
.done h2{font-size:20px;letter-spacing:.12em;font-weight:500;margin-bottom:8px}
.done .price{font-size:16px;color:var(--matcha);margin-top:6px}
[hidden]{display:none!important}
</style></head><body>

<header><div class="hd">
  <b>悠三堂　茶器を登録</b>
  <a href="/stock.html">← 在庫一覧</a>
</div></header>

<div class="wrap">
  <h1>茶器を登録する</h1>
  <p class="lede">写真を選ぶと、AIが銘・説明・等級を考えて掲載します。1〜5枚まで。<br>
    ライブラリから選んでも、その場で撮っても構いません。</p>

  <form id="form">

    <div class="field">
      <div class="label">写真 <span class="count" id="count">0 / 5 枚</span></div>

      <div class="guide">
        <div class="g"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="7.6" rx="8" ry="2.2"/><path d="M4 7.6c.35 6.1 3.5 10.2 8 10.2s7.65-4.1 8-10.2"/><path d="M9.9 17.6 9.3 20.4M14.1 17.6l.6 2.8M8.7 20.4h6.6"/></svg>
          <b>正面</b><span>真横から全体</span></div>
        <div class="g"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.4" ry="8.4"/><ellipse cx="12" cy="12" rx="3.6" ry="3.6"/></svg>
          <b>高台</b><span>底の削り</span></div>
        <div class="g"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.6" ry="8.6"/><path d="M6.6 9.4c2 2.6 8.8 2.6 10.8 0"/></svg>
          <b>見込み</b><span>内側の景色</span></div>
        <div class="g"><svg viewBox="0 0 24 24"><path d="M3.8 7.4h16.4v13.2H3.8z"/><path d="M3.8 11.4h16.4M12 7.4v13.2"/><path d="M8.4 3.6h7.2v3.8H8.4z"/></svg>
          <b>共箱</b><span>あれば箱書きも</span></div>
      </div>

      <div class="drop" id="drop">
        <p>ここをタップして写真を選ぶ</p>
        <small>ライブラリから複数まとめて選べます／その場で撮影も可</small>
        <span class="btn" id="pick">写真を選ぶ</span>
      </div>
      <input id="photos" type="file" accept="image/*" multiple>

      <div class="thumbs" id="thumbs"></div>
      <p class="hint" id="hint" hidden>1枚目が一覧のサムネイルになります。↑↓ で順番を入れ替えられます。</p>
    </div>

    <div class="field">
      <div class="label">等級（価格）</div>
      <select id="tier">
        <option value="">AIにおまかせ</option>
        <option value="1">1 — ¥3,000</option>
        <option value="2">2 — ¥5,000</option>
        <option value="3">3 — ¥7,000</option>
        <option value="4">4 — ¥10,000</option>
      </select>
    </div>

    <div class="field">
      <div class="label">合言葉</div>
      <input id="token" type="password" autocomplete="current-password">
    </div>

    <div class="field">
      <button class="btn solid" id="submit" type="submit" disabled>登録して掲載する</button>
    </div>
  </form>

  <div id="msg"></div>
</div>

<script>
const API = "https://yusando-gallery.isozaki-f67.workers.dev";
const MAX = 5;
const $ = (id) => document.getElementById(id);
let files = [];                    // {file, url} の配列。これが送信順になる

/* ---------- 合言葉を覚えておく ---------- */
$("token").value = localStorage.getItem("ysd_token") || "";

/* ---------- 写真を選ぶ ---------- */
$("pick").addEventListener("click", (e) => { e.stopPropagation(); $("photos").click(); });
$("drop").addEventListener("click", () => $("photos").click());
$("photos").addEventListener("change", (e) => { add(e.target.files); e.target.value = ""; });

["dragenter", "dragover"].forEach((t) =>
  $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
["dragleave", "drop"].forEach((t) =>
  $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.remove("over"); }));
$("drop").addEventListener("drop", (e) => add(e.dataTransfer.files));

function add(list) {
  const incoming = Array.from(list).filter((f) => f.type.startsWith("image/"));
  const room = MAX - files.length;
  if (room <= 0) return note("写真は" + MAX + "枚までです。入れ替えるには不要な写真を × で消してください。", "err");
  if (incoming.length > room) note("あと" + room + "枚まで追加できます。先頭の" + room + "枚を追加しました。", "err");
  incoming.slice(0, room).forEach((f) => files.push({ file: f, url: URL.createObjectURL(f) }));
  render();
}

function move(i, d) {
  const j = i + d;
  if (j < 0 || j >= files.length) return;
  [files[i], files[j]] = [files[j], files[i]];
  render();
}
function remove(i) { URL.revokeObjectURL(files[i].url); files.splice(i, 1); render(); }

function render() {
  const box = $("thumbs");
  box.innerHTML = "";
  files.forEach((f, i) => {
    const d = document.createElement("div");
    d.className = "th" + (i === 0 ? " first" : "");
    d.innerHTML =
      '<img src="' + f.url + '" alt="">' +
      '<span class="no">' + (i === 0 ? "1枚目（表紙）" : i + 1 + "枚目") + "</span>" +
      '<button class="rm" type="button" aria-label="この写真を外す">×</button>' +
      '<span class="name"></span>' +
      '<div class="bar"><button type="button" aria-label="前へ">↑</button>' +
      '<button type="button" aria-label="後ろへ">↓</button></div>';
    d.querySelector(".name").textContent = f.file.name;
    d.querySelector(".rm").onclick = () => remove(i);
    const [up, dn] = d.querySelectorAll(".bar button");
    up.disabled = i === 0; dn.disabled = i === files.length - 1;
    up.onclick = () => move(i, -1);
    dn.onclick = () => move(i, 1);
    box.appendChild(d);
  });
  $("count").textContent = files.length + " / " + MAX + " 枚";
  $("hint").hidden = files.length < 2;
  $("submit").disabled = files.length === 0;
}

function note(text, kind) {
  $("msg").innerHTML = '<div class="msg ' + (kind || "") + '"></div>';
  $("msg").firstChild.textContent = text;
}

/* ---------- 送信前に長辺1600pxへ縮小 ---------- */
async function shrink(file) {
  const img = await new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = rej;
    im.src = URL.createObjectURL(file);
  });
  const s = Math.min(1, 1600 / Math.max(img.width, img.height));
  if (s === 1 && file.size < 1.5e6) return file;
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  URL.revokeObjectURL(img.src);
  return new File([blob], (file.name || "photo").replace(/\.\w+$/, "") + ".jpg", { type: "image/jpeg" });
}

/* ---------- 送信 ---------- */
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const token = $("token").value.trim();
  if (!files.length) return note("写真を選んでください。", "err");
  if (!token) return note("合言葉を入れてください。", "err");
  localStorage.setItem("ysd_token", token);

  const btn = $("submit");
  btn.disabled = true;
  const label = btn.textContent;

  try {
    const fd = new FormData();
    for (let i = 0; i < files.length; i++) {
      btn.textContent = "写真を準備中… " + (i + 1) + "/" + files.length;
      fd.append("photos", await shrink(files[i].file));
    }
    if ($("tier").value) fd.append("tier", $("tier").value);

    btn.textContent = "AIが見ています… 20秒ほど";
    const res = await fetch(API + "/api/upload", {
      method: "POST", headers: { "x-upload-token": token }, body: fd
    });
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(j.error || ("エラー " + res.status));

    $("form").hidden = true;
    $("msg").innerHTML =
      '<div class="msg ok done"><h2></h2><p class="price"></p>' +
      '<p style="margin-top:12px"><a id="lnk" href="#">掲載ページを見る →</a>　' +
      '<a href="/upload.html">続けて登録する</a></p></div>';
    $("msg").querySelector("h2").textContent = (j.mei || "登録しました");
    $("msg").querySelector(".price").textContent =
      "等級 " + j.tier + "　¥" + Number(j.price || 0).toLocaleString("ja-JP");
    $("lnk").href = j.url || ("/item.html?id=" + j.id);
  } catch (err) {
    note("登録できませんでした: " + (err && err.message ? err.message : err), "err");
    btn.disabled = false;
    btn.textContent = label;
  }
});

render();
</script></body></html>
