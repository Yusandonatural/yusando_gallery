<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>悠三堂 茶器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
:root{--paper:#f7f3ea;--paper-deep:#efe8d8;--ink:#2b2a26;--ink-soft:#5a564c;
  --matcha:#4a5d3a;--matcha-deep:#37452b;--rikyu:#8a8c78;--shu:#a53f2b;
  --gold:#b0965a;--line:#d8cfba;
  --serif:"Shippori Mincho",serif;--sans:"Zen Kaku Gothic New",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);
  line-height:1.9;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

header{border-bottom:1px solid var(--line);background:rgba(247,243,234,.94);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
.hd{max-width:940px;margin:0 auto;padding:0 22px;height:60px;
  display:flex;align-items:center;gap:16px}
.hd .brand{font-size:15px;letter-spacing:.12em;font-weight:600;white-space:nowrap}
.hd .back{margin-left:auto;font-family:var(--sans);font-size:11.5px;
  letter-spacing:.1em;color:var(--ink-soft);text-align:right;line-height:1.5}
.hd .back i{display:block;font-style:normal;font-size:9.5px;color:var(--rikyu);letter-spacing:.14em}

.wrap{max-width:940px;margin:0 auto;padding:0 22px 90px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:44px;padding-top:44px}
@media (max-width:780px){.grid{grid-template-columns:1fr;gap:30px;padding-top:28px}}

.stage{border:1px solid var(--line);background:var(--paper-deep);border-radius:2px;
  aspect-ratio:1;overflow:hidden}
.stage img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap}
.thumbs img{width:62px;height:62px;object-fit:cover;border:1px solid var(--line);
  border-radius:2px;cursor:pointer;opacity:.62;transition:.25s}
.thumbs img.on,.thumbs img:hover{opacity:1;border-color:var(--gold)}

/* 銘は訳さず、漢字の下にローマ字を添える */
.mei{font-size:clamp(27px,4.6vw,36px);letter-spacing:.14em;font-weight:500;line-height:1.4}
.sku{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--rikyu);
  border:1px solid var(--line);border-radius:2px;padding:3px 9px;display:inline-block;margin-bottom:10px}
.mei-en{font-family:var(--sans);font-size:clamp(13px,2vw,15px);letter-spacing:.16em;
  font-weight:400;color:var(--matcha);margin-top:8px;line-height:1.5}
.yomi{font-family:var(--sans);font-size:10.5px;letter-spacing:.2em;color:var(--gold);margin-top:8px}

/* 由来・説明は 日本語 → 英語 の順に、英語は一段落とした色で */
.reason{font-size:13.5px;color:var(--ink-soft);margin-top:18px;padding-left:14px;
  border-left:1px solid var(--gold);line-height:1.95}
.reason .en{display:block;margin-top:6px;color:var(--rikyu);font-size:12.5px}
.desc{margin-top:26px;font-size:15px;line-height:2.15}
.desc .en{display:block;margin-top:16px;padding-top:16px;border-top:1px dotted var(--line);
  font-size:14px;line-height:2.05;color:var(--ink-soft)}

.sekki{display:flex;flex-wrap:wrap;gap:6px;margin-top:24px}
.sekki span{font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;color:var(--matcha);
  border:1px solid rgba(74,93,58,.28);border-radius:999px;padding:3px 11px}
.sekki span b{font-weight:400;color:var(--rikyu);margin-left:5px}
.sekki-why{font-family:var(--sans);font-size:11.5px;color:var(--rikyu);margin-top:9px;line-height:1.8}
.sekki-why .en{display:block;margin-top:3px}

dl{margin-top:32px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:7.5em 1fr;gap:16px;padding:13px 2px;
  border-bottom:1px solid var(--line);align-items:baseline}
dt{font-family:var(--sans);font-size:11px;letter-spacing:.1em;color:var(--matcha);line-height:1.6}
dt i{display:block;font-style:normal;font-size:9px;letter-spacing:.14em;color:var(--rikyu);margin-top:2px}
dd{font-size:13.5px;line-height:1.95;color:var(--ink-soft)}
dd .en{display:block;color:var(--rikyu);font-size:12.5px;margin-top:4px}
@media (max-width:520px){.row{grid-template-columns:1fr;gap:4px}dt i{display:inline;margin-left:8px}}

.status{margin-top:30px;padding-top:22px;border-top:1px solid var(--line);
  font-family:var(--sans);font-size:12px;letter-spacing:.12em;color:var(--matcha);line-height:1.7}
.status i{display:block;font-style:normal;font-size:10.5px;color:var(--rikyu);letter-spacing:.1em}
.status.gone{color:var(--rikyu)}
.btn{display:inline-block;font-family:var(--sans);font-size:12px;letter-spacing:.14em;
  padding:14px 28px;border:1px solid var(--matcha);color:var(--matcha);
  margin-top:16px;transition:.3s;border-radius:2px;line-height:1.6;text-align:center}
.btn i{display:block;font-style:normal;font-size:10px;opacity:.75;letter-spacing:.1em}
.btn:hover{background:var(--matcha);color:var(--paper)}
.note{font-family:var(--sans);font-size:11px;color:var(--rikyu);margin-top:14px;line-height:1.8}
.note .en{display:block}
.msg{padding:80px 0;text-align:center;font-family:var(--sans);font-size:14px;color:var(--rikyu)}
</style></head><body>

<header><div class="hd">
  <a class="brand" href="/index.html">悠三堂</a>
  <a class="back" href="/stock.html">← 一覧<i>ALL PIECES</i></a>
</div></header>

<div class="wrap"><div id="d"><p class="msg">読み込んでいます… / Loading…</p></div></div>

<script>
const API = "https://yusando-gallery.isozaki-f67.workers.dev";
const INQUIRY = "https://form.jotform.com/262528014622047";
const id = new URLSearchParams(location.search).get("id");

const SEKKI_EN = {"立春":"Risshun","雨水":"Usui","啓蟄":"Keichitsu","春分":"Shunbun",
"清明":"Seimei","穀雨":"Kokuu","立夏":"Rikka","小満":"Shōman","芒種":"Bōshu",
"夏至":"Geshi","小暑":"Shōsho","大暑":"Taisho","立秋":"Risshū","処暑":"Shosho",
"白露":"Hakuro","秋分":"Shūbun","寒露":"Kanro","霜降":"Sōkō","立冬":"Rittō",
"小雪":"Shōsetsu","大雪":"Taisetsu","冬至":"Tōji","小寒":"Shōkan","大寒":"Daikan"};

const CAT_EN = {"茶碗":"Chawan — tea bowl","茶入":"Chaire — thick-tea caddy",
"棗":"Natsume — thin-tea caddy","水指":"Mizusashi — water jar","建水":"Kensui — waste-water bowl",
"蓋置":"Futaoki — lid rest","茶杓":"Chashaku — tea scoop","花入":"Hanaire — flower vessel",
"香合":"Kōgō — incense container","釜・風炉":"Kama / Furo — kettle & brazier",
"急須・宝瓶":"Kyūsu / Hōhin — teapot","湯冷まし":"Yuzamashi — cooling bowl",
"湯呑・茶托":"Yunomi / Chataku — cup & saucer","菓子器":"Kashiki — sweets dish",
"掛物":"Kakemono — hanging scroll","その他":"Other"};

const ROWS = [["種別","TYPE"],["技法","TECHNIQUE"],["釉・土","GLAZE & CLAY"],
              ["産地","ORIGIN"],["時代","PERIOD"],["状態","CONDITION"],["箱","BOX"]];

const esc = (v) => String(v == null ? "" : v).replace(/[&<>"]/g,
  (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

let item = null, shot = 0;

/* 日本語 / 英語 を上下に重ねる。英語が無ければ日本語だけ出す */
function pair(ja, en) {
  if (!ja && !en) return "—";
  return esc(ja || "") + (en && en !== ja ? '<span class="en">' + esc(en) + "</span>" : "");
}

function render() {
  const d = document.getElementById("d");
  if (item === false) {
    d.innerHTML = '<p class="msg">この茶器は見つかりませんでした。<br>This piece could not be found.</p>';
    return;
  }
  if (!item) return;
  const i = item;

  document.title = (i.mei || "茶器") + "｜悠三堂";

  const photos = i.photos || [];
  const stage = photos.length
    ? '<div class="stage"><img src="' + API + "/photos/" + esc(photos[shot])
      + '" alt="' + esc(i.mei || "") + '"></div>'
      + (photos.length > 1 ? '<div class="thumbs">' + photos.map((p, n) =>
          '<img data-n="' + n + '" class="' + (n === shot ? "on" : "") + '" src="'
          + API + "/photos/" + esc(p) + '" alt="">').join("") + "</div>" : "")
    : '<div class="stage"></div>';

  let sk = i.sekki;
  if (typeof sk === "string") { try { sk = JSON.parse(sk); } catch (e) { sk = sk.split(/[,・]/); } }
  const sekki = (Array.isArray(sk) && sk.length)
    ? '<div class="sekki">' + sk.map((v) =>
        "<span>" + esc(v) + "<b>" + esc(SEKKI_EN[v] || "") + "</b></span>").join("") + "</div>"
      + ((i.sekki_reason || i.sekki_reason_en)
          ? '<p class="sekki-why">' + esc(i.sekki_reason || "")
            + (i.sekki_reason_en ? '<span class="en">' + esc(i.sekki_reason_en) + "</span>" : "")
            + "</p>" : "")
    : "";

  const vals = [
    [i.category, CAT_EN[i.category] || ""],
    [i.technique, i.technique_en], [i.glaze, i.glaze_en],
    [i.kiln, i.kiln_en], [i.era, i.era_en], [i.condition, i.condition_en],
    [i.has_box ? "あり" : "なし", i.has_box ? "Yes" : "No"],
  ];
  const rows = ROWS.map(([ja, en], n) =>
    '<div class="row"><dt>' + ja + "<i>" + en + "</i></dt><dd>"
    + pair(vals[n][0], vals[n][1]) + "</dd></div>").join("");

  const sold = i.status === "sold";
  const action = sold
    ? '<p class="status gone">お渡し済みです<i>No longer available</i></p>'
    : '<p class="status">お問い合わせください<i>Please enquire</i></p>'
      + '<a class="btn" href="' + INQUIRY + "?item=" + encodeURIComponent(i.sku || i.id)
      + "&mei=" + encodeURIComponent(i.mei || "")
      + '">この茶器について問い合わせる<i>Enquire about this piece</i></a>'
      + '<p class="note">オンラインでの販売は行っておりません。'
      + '<span class="en">Online ordering is not available.</span></p>';

  d.innerHTML = '<div class="grid"><div>' + stage + "</div><div>"
    + (i.sku ? '<p class="sku">' + esc(i.sku) + "</p>" : "")
    + '<h2 class="mei">' + esc(i.mei || "無銘") + "</h2>"
    + (i.mei_romaji ? '<p class="mei-en">' + esc(i.mei_romaji) + "</p>" : "")
    + (i.mei_yomi ? '<p class="yomi">' + esc(i.mei_yomi) + "</p>" : "")
    + ((i.mei_reason || i.mei_reason_en)
        ? '<p class="reason">' + esc(i.mei_reason || "")
          + (i.mei_reason_en ? '<span class="en">' + esc(i.mei_reason_en) + "</span>" : "")
          + "</p>" : "")
    + ((i.description || i.description_en)
        ? '<p class="desc">' + esc(i.description || "")
          + (i.description_en ? '<span class="en">' + esc(i.description_en) + "</span>" : "")
          + "</p>" : "")
    + sekki + "<dl>" + rows + "</dl>" + action
    + "</div></div>";

  d.querySelectorAll(".thumbs img").forEach((el) => {
    el.onclick = () => { shot = +el.dataset.n; render(); };
  });
}

fetch(API + "/api/items/" + encodeURIComponent(id))
  .then((r) => (r.ok ? r.json() : null))
  .then((i) => { item = i && !i.error ? i : false; render(); })
  .catch(() => { item = false; render(); });
</script></body></html>
