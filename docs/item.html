<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>悠三堂 茶器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head><body>
<header class="site"><h1><a href="/stock.html">悠三堂　茶器</a></h1><span class="note">奈良・都祁より</span></header>
<main class="detail" id="d"></main>
<script>
const API="https://yusando-gallery.isozaki-f67.workers.dev";
const id=new URLSearchParams(location.search).get("id");
const yen = n => "¥" + n.toLocaleString("ja-JP");
const INQUIRY = "https://yusando.com/pages/contact"; // 購入希望の送り先（Jotform等に変更可）
fetch(API+"/api/items/"+id).then(r=>r.ok?r.json():null).then(i=>{
  const d=document.getElementById("d");
  if(!i){d.innerHTML='<p class="empty">この茶器は見つかりませんでした。</p>';return;}
  document.title=`${i.mei||"茶器"}｜悠三堂`;
  d.innerHTML=`
   <div class="photos">${i.photos.map(p=>`<img src="${API}/photos/${p}" alt="${i.mei||""}">`).join("")}</div>
   <div class="head">
     <div><p class="reason">${i.mei_reason||""}</p></div>
     <h2 class="mei">${i.mei||"無銘"}<small>${i.mei_yomi||""}</small></h2>
   </div>
   <p class="desc">${i.description||""}</p>
   <dl>
     <dt>種別</dt><dd>${i.category||"—"}</dd>
     <dt>技法</dt><dd>${i.technique||"—"}</dd>
     <dt>釉・土</dt><dd>${i.glaze||"—"}</dd>
     <dt>産地</dt><dd>${i.kiln||"—"}</dd>
     <dt>時代</dt><dd>${i.era||"—"}</dd>
     <dt>状態</dt><dd>${i.condition||"—"}</dd>
     <dt>箱</dt><dd>${i.has_box?"あり":"なし"}</dd>
   </dl>
   <p class="price">${yen(i.price)}${i.status==="sold"?"　売却済":""}</p>
   ${i.status==="sold"?"":`<a class="buy" href="${INQUIRY}?item=${i.id}&mei=${encodeURIComponent(i.mei||"")}">この茶器について問い合わせる</a>`}
   <a class="back" href="/stock.html">一覧へ戻る</a>`;
});
</script></body></html>
