<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>悠三堂ギャラリーの茶道具｜Pieces in the Yusando Gallery</title>
<meta name="description" content="悠三堂ギャラリーにある茶道具の一覧。すべて一点もの。Tea utensils held in the Yusando gallery, each one of a kind.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<style>
:root{--paper:#f7f3ea;--paper-deep:#efe8d8;--ink:#2b2a26;--ink-soft:#5a564c;
  --matcha:#4a5d3a;--matcha-deep:#37452b;--rikyu:#8a8c78;--shu:#a53f2b;
  --gold:#b0965a;--line:#d8cfba;
  --serif:"Shippori Mincho",serif;--sans:"Zen Kaku Gothic New",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);
  line-height:1.9;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

header{border-bottom:1px solid var(--line);background:rgba(247,243,234,.94);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)}
.hd{max-width:1080px;margin:0 auto;padding:0 22px;height:60px;
  display:flex;align-items:center;gap:16px}
.hd .brand{font-size:15px;letter-spacing:.12em;font-weight:600;white-space:nowrap}
.hd .home{margin-left:auto;font-family:var(--sans);font-size:11.5px;
  letter-spacing:.1em;color:var(--ink-soft);text-align:right;line-height:1.5}
.hd .home i{display:block;font-style:normal;font-size:9.5px;color:var(--rikyu);letter-spacing:.14em}

.wrap{max-width:1080px;margin:0 auto;padding:0 22px 90px}
.intro{text-align:center;padding:56px 0 34px}
.intro h1{font-size:clamp(23px,4vw,31px);letter-spacing:.14em;font-weight:500;line-height:1.5}
.intro .en{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.22em;
  color:var(--gold);margin-top:10px}
.intro .rule{width:52px;height:1px;background:var(--gold);margin:22px auto 0}
.intro p{margin-top:20px;font-size:14px;color:var(--ink-soft);line-height:2}
.intro p .en{font-family:var(--sans);font-size:12px;color:var(--rikyu);
  letter-spacing:.04em;margin-top:6px}

.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:34px}
.tab{font-family:var(--sans);font-size:11.5px;letter-spacing:.08em;line-height:1.5;
  padding:8px 16px;border:1px solid var(--line);border-radius:999px;
  background:var(--paper);color:var(--ink-soft);cursor:pointer;transition:.25s;text-align:center}
.tab i{display:block;font-style:normal;font-size:9px;letter-spacing:.12em;color:var(--rikyu)}
.tab:hover{border-color:var(--gold)}
.tab.on{background:var(--matcha);border-color:var(--matcha);color:var(--paper)}
.tab.on i{color:rgba(247,243,234,.72)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:24px}
@media (max-width:640px){.grid{grid-template-columns:1fr 1fr;gap:14px}}

.card{display:flex;flex-direction:column;height:100%;transition:transform .4s ease}
a.card:hover{transform:translateY(-3px)}
.frame{position:relative;aspect-ratio:1;overflow:hidden;background:var(--paper-deep);
  border:1px solid var(--line);border-radius:2px}
.frame img{width:100%;height:100%;object-fit:cover;
  transition:transform .6s cubic-bezier(.2,.6,.2,1)}
a.card:hover .frame img{transform:scale(1.045)}
a.card:hover .frame{border-color:var(--gold)}
.badge{position:absolute;left:0;bottom:0;font-family:var(--sans);font-size:9.5px;
  letter-spacing:.16em;color:var(--paper);background:rgba(43,42,38,.82);padding:5px 12px;line-height:1.5}
.badge i{display:block;font-style:normal;font-size:8.5px;opacity:.8}
.card.sold .frame img{filter:grayscale(.9);opacity:.68}

.body{flex:1;display:flex;flex-direction:column;padding:14px 2px 0}
.mei{font-size:17px;letter-spacing:.13em;font-weight:500;line-height:1.5}
.romaji{font-family:var(--sans);font-size:10px;letter-spacing:.16em;color:var(--gold);margin-top:4px}
.cat{font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;color:var(--rikyu);margin-top:9px}
.sekki{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 12px}
.sekki span{font-family:var(--sans);font-size:9.5px;letter-spacing:.06em;color:var(--matcha);
  border:1px solid rgba(74,93,58,.28);border-radius:999px;padding:2px 9px;line-height:1.7}
.ask{font-family:var(--sans);font-size:10.5px;letter-spacing:.12em;color:var(--matcha);
  margin-top:auto;padding-top:11px;border-top:1px solid var(--line);line-height:1.6}
.ask i{display:block;font-style:normal;font-size:9.5px;color:var(--rikyu);letter-spacing:.08em}
.card.sold .ask{color:var(--rikyu)}

.note{margin-top:40px;text-align:center;font-family:var(--sans);font-size:11.5px;
  color:var(--rikyu);line-height:1.9}
.msg{padding:70px 0;text-align:center;font-family:var(--sans);font-size:13.5px;
  color:var(--rikyu);line-height:2}
@media (max-width:640px){
  .mei{font-size:15px}.romaji{font-size:9px}
  .cat{font-size:9.5px;margin-top:7px}
  .ask{font-size:9.5px;padding-top:9px}
}
.note-link{color:var(--gold);border-bottom:1px solid currentColor;text-decoration:none;display:inline-block;margin-top:6px}
</style></head><body>

<header><div class="hd">
  <a class="brand" href="/index.html">悠三堂</a>
  <a class="home" href="/index.html">茶道具のポータルへ<i>UTENSIL PORTAL</i></a>
</div></header>

<div class="wrap">
  <div class="intro">
    <h1>悠三堂ギャラリーの茶道具<span class="en">PIECES IN THE YUSANDO GALLERY</span></h1>
    <div class="rule"></div>
    <p>すべて一点もの。奈良・都祁の悠三堂にございます。
       <span class="en">Each piece is one of a kind, held at Yusando in Tsuge, Nara.</span></p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="list"><p class="msg">読み込んでいます…<br>Loading…</p></div>
</div>

<script>
const API = "https://yusando-gallery.isozaki-f67.workers.dev";
const INQUIRY = "https://form.jotform.com/262528014622047";

const SEKKI_EN = {"立春":"Risshun","雨水":"Usui","啓蟄":"Keichitsu","春分":"Shunbun",
"清明":"Seimei","穀雨":"Kokuu","立夏":"Rikka","小満":"Shōman","芒種":"Bōshu",
"夏至":"Geshi","小暑":"Shōsho","大暑":"Taisho","立秋":"Risshū","処暑":"Shosho",
"白露":"Hakuro","秋分":"Shūbun","寒露":"Kanro","霜降":"Sōkō","立冬":"Rittō",
"小雪":"Shōsetsu","大雪":"Taisetsu","冬至":"Tōji","小寒":"Shōkan","大寒":"Daikan"};

/* 種別のローマ字。銘と同じく訳さず読みを添える */
const CAT_EN = {"茶碗":"Chawan","茶入":"Chaire","棗":"Natsume","水指":"Mizusashi",
"建水":"Kensui","蓋置":"Futaoki","茶杓":"Chashaku","花入":"Hanaire","香合":"Kōgō",
"釜・風炉":"Kama / Furo","急須・宝瓶":"Kyūsu / Hōhin","湯冷まし":"Yuzamashi",
"湯呑・茶托":"Yunomi / Chataku","菓子器":"Kashiki","掛物":"Kakemono","その他":"Other"};

const esc = (v) => String(v == null ? "" : v).replace(/[&<>"]/g,
  (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

let items = [], filter = "";

function cards(list) {
  if (!list.length) {
    return '<p class="msg">この種別の道具はただいまございません。<br>'
         + "No pieces of this kind at the moment.</p>";
  }
  return '<div class="grid">' + list.map((i) => {
    const sold = i.status === "sold";
    const photo = (i.photos && i.photos[0])
      ? '<img loading="lazy" alt="' + esc(i.mei || "") + '" src="'
        + API + "/photos/" + esc(i.photos[0]) + '">' : "";
    let sk = i.sekki;
    if (typeof sk === "string") { try { sk = JSON.parse(sk); } catch (e) { sk = sk.split(/[,・]/); } }
    const sekki = (Array.isArray(sk) && sk.length)
      ? '<p class="sekki">' + sk.slice(0, 3).map((v) =>
          "<span>" + esc(v) + " " + esc(SEKKI_EN[v] || "") + "</span>").join("") + "</p>" : "";
    return '<a class="card' + (sold ? " sold" : "") + '" href="/item.html?id='
      + encodeURIComponent(i.id) + '">'
      + '<span class="frame">' + photo
      + (sold ? '<span class="badge">お渡し済み<i>NO LONGER AVAILABLE</i></span>' : "")
      + "</span>"
      + '<span class="body">'
      + '<span class="mei">' + esc(i.mei || "無銘") + "</span>"
      + (i.mei_romaji ? '<span class="romaji">' + esc(i.mei_romaji) + "</span>" : "")
      + '<span class="cat">' + esc(i.category || "")
      + (CAT_EN[i.category] ? " " + esc(CAT_EN[i.category]) : "") + "</span>"
      + sekki
      + '<span class="ask">' + (sold ? "お渡し済み" : "お問い合わせください")
      + "<i>" + (sold ? "No longer available" : "Please enquire") + "</i></span>"
      + "</span></a>";
  }).join("") + "</div>";
}

function draw() {
  const list = filter ? items.filter((i) => i.category === filter) : items;
  document.getElementById("list").innerHTML = cards(list)
    + '<p class="note">価格・状態はお問い合わせください。オンラインでの販売は行っておりません。<br>'
    + "Please enquire about any piece. Online ordering is not available.<br>"
    + '<a class="note-link" href="' + INQUIRY + '">お問い合わせフォーム / Enquiry form</a></p>';
  document.querySelectorAll(".tab").forEach((t) =>
    t.classList.toggle("on", (t.dataset.cat || "") === filter));
}

function tabs() {
  const seen = [];
  items.forEach((i) => { if (i.category && seen.indexOf(i.category) < 0) seen.push(i.category); });
  if (seen.length < 2) return;                     // 種別が1つなら出さない
  const box = document.getElementById("tabs");
  box.innerHTML = '<button class="tab on" data-cat="">すべて<i>ALL</i></button>'
    + seen.map((c) => '<button class="tab" data-cat="' + esc(c) + '">' + esc(c)
        + "<i>" + esc(CAT_EN[c] || "") + "</i></button>").join("");
  box.querySelectorAll(".tab").forEach((t) => {
    t.onclick = () => { filter = t.dataset.cat || ""; draw(); };
  });
}

fetch(API + "/api/items").then((r) => (r.ok ? r.json() : [])).then((all) => {
  items = (all || []).filter((i) => i.status !== "hidden");
  if (!items.length) {
    document.getElementById("list").innerHTML =
      '<p class="msg">ただいま準備中です。<br>Pieces will appear here shortly.</p>';
    return;
  }
  tabs(); draw();
}).catch(() => {
  document.getElementById("list").innerHTML =
    '<p class="msg">読み込めませんでした。<br>Could not load the pieces.</p>';
});
</script></body></html>
