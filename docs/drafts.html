<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>下書きを確認する — 悠三堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f3ea;--paper-deep:#efe8d8;--ink:#2b2a26;--ink-soft:#5a564c;
  --matcha:#4a5d3a;--matcha-deep:#37452b;--rikyu:#8a8c78;--shu:#a53f2b;
  --gold:#b0965a;--line:#d8cfba;
  --serif:"Shippori Mincho",serif;--sans:"Zen Kaku Gothic New",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);
  line-height:1.9;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 120px}
header{border-bottom:1px solid var(--line);background:rgba(247,243,234,.94);
  position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}
.hd{max-width:960px;margin:0 auto;padding:0 20px;height:58px;display:flex;align-items:center;gap:16px}
.hd b{font-size:15px;letter-spacing:.12em;font-weight:600}
.hd nav{margin-left:auto;display:flex;gap:16px}
.hd nav a{font-family:var(--sans);font-size:11.5px;letter-spacing:.12em;color:var(--ink-soft)}
.hd nav a:hover{color:var(--matcha)}
h1{font-size:24px;letter-spacing:.14em;font-weight:500;margin-top:36px}
.lede{font-family:var(--sans);font-size:13px;line-height:1.95;color:var(--ink-soft);margin-top:12px}
.label{font-family:var(--sans);font-size:12px;letter-spacing:.16em;color:var(--matcha);margin-bottom:12px}
.hint{font-family:var(--sans);font-size:11.5px;color:var(--rikyu);margin-top:9px;line-height:1.8}

.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:26px}
.tools select,.tools input{font-family:var(--sans);font-size:13px;padding:10px 12px;
  border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink)}
.tools input[type=password]{flex:1;min-width:180px}

.card{border:1px solid var(--line);border-radius:5px;background:var(--paper-deep);
  margin-top:14px;display:grid;grid-template-columns:132px 1fr;gap:0;overflow:hidden}
@media (max-width:620px){.card{grid-template-columns:1fr}}
.card.warn{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.card.failed{border-color:rgba(165,63,43,.5);box-shadow:inset 3px 0 0 var(--shu)}
.card .shot{position:relative;background:#fff;border-right:1px solid var(--line)}
/* 写真の列は本文と同じ高さまで伸ばす。正方形で固定すると、説明の長い行で
   下に白い余りが出る。狭い画面では上下に積むので横長に切り替える。 */
.card .shot{display:flex}
.card .shot img{width:100%;height:100%;min-height:132px;object-fit:cover;background:var(--paper-deep)}
@media (max-width:620px){.card .shot img{aspect-ratio:16/9;height:auto;min-height:0}}
.card .shot .pick{position:absolute;top:8px;left:8px;width:24px;height:24px;accent-color:var(--matcha)}
.card .body{padding:14px 16px}
.card .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .mei{font-size:18px;letter-spacing:.1em}
.card .sku{font-family:var(--sans);font-size:10.5px;letter-spacing:.18em;color:var(--rikyu);
  border:1px solid var(--line);border-radius:2px;padding:2px 8px}
.card .romaji{font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--gold)}
.card .id{margin-left:auto;font-family:var(--sans);font-size:10.5px;color:var(--rikyu)}
.card .desc{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);margin-top:8px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.card .meta select{font-family:var(--sans);font-size:12px;padding:6px 9px;
  border:1px solid var(--line);border-radius:3px;background:var(--paper);color:var(--ink)}
.flag{display:inline-block;font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;
  padding:3px 10px;border-radius:999px;margin-top:10px}
.flag.warn{background:#f3ecd9;color:#8a6d22;border:1px solid var(--gold)}
.flag.failed{background:#f6e8e4;color:var(--shu);border:1px solid rgba(165,63,43,.45)}
.card .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini{font-family:var(--sans);font-size:10.5px;letter-spacing:.08em;padding:5px 12px;
  border:1px solid var(--line);border-radius:3px;background:var(--paper);
  color:var(--ink-soft);cursor:pointer;transition:.2s}
.mini:hover{border-color:var(--matcha);color:var(--matcha)}
.mini:disabled{opacity:.4;cursor:default}

.footbar{position:fixed;left:0;right:0;bottom:0;background:rgba(247,243,234,.97);
  border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:30}
.footbar .in{max-width:960px;margin:0 auto;padding:13px 20px;display:flex;gap:12px;
  align-items:center;flex-wrap:wrap}
.footbar .n{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);margin-right:auto}
.btn{display:inline-block;font-family:var(--sans);font-size:12.5px;letter-spacing:.14em;
  padding:11px 24px;border:1px solid var(--matcha);color:var(--matcha);
  background:transparent;cursor:pointer;transition:.3s;border-radius:2px}
.btn:hover{background:var(--matcha);color:var(--paper)}
.btn.solid{background:var(--matcha);color:var(--paper)}
.btn.solid:hover{background:var(--matcha-deep)}
.btn.danger{border-color:var(--shu);color:var(--shu)}
.btn.danger:hover{background:var(--shu);color:var(--paper)}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:transparent;color:var(--matcha)}
.msg{margin-top:18px;font-family:var(--sans);font-size:13px;line-height:1.9;
  padding:14px 16px;border-radius:4px;border:1px solid var(--line);background:var(--paper-deep)}
.msg.err{border-color:rgba(165,63,43,.4);color:var(--shu)}
.msg.ok{border-color:rgba(74,93,58,.4)}
.msg a{color:var(--matcha);border-bottom:1px solid rgba(74,93,58,.35)}
[hidden]{display:none!important}
</style></head><body>

<header><div class="hd">
  <b>悠三堂　下書き</b>
  <nav>
    <a href="/bulk.html">まとめて登録</a>
    <a href="/upload.html">1点ずつ</a>
    <a href="/stock.html">在庫一覧</a>
  </nav>
</div></header>

<div class="wrap">
  <h1>下書きを確認する</h1>
  <p class="lede">AIが読み取った内容です。銘や説明は各ページで直せます。<br>
    写真の組み合わせに疑いがあるものには印が付いています。確かめてから公開してください。</p>

  <div class="tools">
    <input type="password" id="token" placeholder="合言葉" autocomplete="current-password">
    <select id="filter">
      <option value="draft">下書きのみ</option>
      <option value="">すべて</option>
      <option value="published">公開中</option>
      <option value="hidden">非公開</option>
    </select>
    <button class="btn" id="load">読み込む</button>
  </div>

  <div id="msg" class="msg" hidden></div>
  <div id="list"></div>
</div>

<div class="footbar" id="footbar" hidden><div class="in">
  <span class="n" id="sel">0 点を選択中</span>
  <button class="mini" id="all">すべて選ぶ</button>
  <button class="mini" id="none">選択を外す</button>
  <button class="btn danger" id="del">削除</button>
  <button class="btn solid" id="pub">まとめて公開する</button>
</div></div>

<script src="/js/drafts.js"></script>
</body></html>
